<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Issue mock</title>
  <style>body{font-family:-apple-system,sans-serif;margin:20px}textarea{width:100%;height:160px}</style>
</head>
<body>
  <nav id="repo-tabs">
    <a href="#" id="tab-code"><span>Code</span></a>
    <a href="#" id="tab-issues"><span>Issues</span></a>
    <a href="#" id="tab-pulls"><span>Pull requests</span></a>
  </nav>

  <main>
    <h1>Add a title</h1>
    <form id="issue-form">
      <input id="issue-title" name="issue[title]" placeholder="Title">
      <textarea name="issue[body]" placeholder="Add your description here..."></textarea>
      <button type="button">Create</button>
    </form>
  </main>
</body>
</html>
