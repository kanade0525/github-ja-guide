<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="popup__head">
      <svg class="icon icon--brand" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/>
      </svg>
      <h1>GitHub 用語ガイド</h1>
    </header>

    <div class="row">
      <label class="switch">
        <input type="checkbox" id="enabled">
        <span class="switch__track"></span>
      </label>
      <span class="row__text">日本語の補足を表示する</span>
    </div>

    <fieldset class="group" id="modeGroup">
      <legend>表示のしかた</legend>
      <label class="radio">
        <input type="radio" name="mode" value="inline">
        <span>横に日本語を添える<em>ホバーで説明も出ます</em></span>
      </label>
      <label class="radio">
        <input type="radio" name="mode" value="tooltip">
        <span>説明だけ出す<em>画面は英語のまま。ホバーで説明</em></span>
      </label>
    </fieldset>

    <p class="note" id="note">GitHub のページを開くと反映されます。</p>

    <footer class="popup__foot">
      <button type="button" id="openOptions" class="btn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
        </svg>
        こまかい設定
      </button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
